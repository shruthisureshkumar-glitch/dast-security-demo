
name: OWASP ZAP DAST Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast_scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Launch Target Web Application
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > server.log 2>&1 &
          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              echo "Web application started successfully."
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/

      - name: Execute OWASP ZAP DAST Scan
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: "http://127.0.0.1:8000"
          fail_action: false
